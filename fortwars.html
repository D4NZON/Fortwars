<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Fortwars 3D - Sunset Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background: #1e1b4b; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(49, 16, 47, 0.9) 0%, rgba(154, 52, 18, 0.9) 100%);
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .box { background: rgba(28, 25, 23, 0.85); padding: 35px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #f97316; }
        h1 { color: #fb923c; margin-top: 0; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #f97316; background: #292524; color: white; text-align: center; text-transform: uppercase; margin: 10px 0; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #ea580c; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: 0.2s; }
        button:hover { background: #f97316; transform: scale(1.03); }
        #hud { position: absolute; top: 15px; left: 15px; color: #fef3c7; font-size: 18px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: none; background: rgba(0,0,0,0.3); padding: 12px 18px; border-radius: 10px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); color: #fde047; font-size: 22px; pointer-events: none; display: none; text-shadow: 1px 1px 2px black; }
        #controls { position: absolute; bottom: 15px; left: 15px; color: #fed7aa; font-size: 14px; text-shadow: 1px 1px 3px black; display: none; background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 8px; }
        #msgBanner { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); color: #ef4444; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 6px black; display: none; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="menu">
    <div class="box">
        <h1>🌅 Fortwars 3D</h1>
        <p style="color: #fed7aa;">Skapa ett rum eller skriv in en kompis kod:</p>
        <button onclick="createRoom()">Skapa nytt spel (Få kod)</button>
        <br><br>
        <input type="text" id="joinCode" placeholder="RUMSKOD" maxlength="5">
        <button onclick="joinRoom()">Gå med i spel</button>
        <p id="status" style="color: #fde047; font-weight: bold; margin-top: 15px;"></p>
    </div>
</div>

<div id="hud">
    <div>Rumskod: <b id="roomDisplay" style="color: #fb923c;">-</b></div>
    <div>Liv: <b id="hpDisplay">100</b> HP</div>
    <div>Byggblock: <b id="buildModeDisplay">Vägg [Q]</b></div>
</div>
<div id="msgBanner">DU BLEV ELIMINERAD!</div>
<div id="crosshair">+</div>
<div id="controls">
    <b>WASD:</b> Spring | <b>Mellanslag:</b> Hoppa | <b>Vänsterklick:</b> Skjut | <b>Högerklick / E:</b> Bygg | <b>Q:</b> Byt Vägg/Ramp
</div>

<script>
let peer, conn;
let isHost = false;
let roomCode = "";
let hp = 100;
let buildMode = "wall";

let scene, camera, renderer;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let velocity = new THREE.Vector3();
let canJump = false;
let prevTime = performance.now();
let walkTime = 0;

let leftArm, rightArm, gun;
let enemyMesh;
let bullets = [];
let buildings = [];

function generateCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let res = "";
    for (let i = 0; i < 5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
    return res;
}

function createRoom() {
    roomCode = generateCode();
    isHost = true;
    document.getElementById("status").innerText = "Din kod är: " + roomCode + " — Startar...";
    
    setTimeout(function() {
        startGame();
    }, 600);

    if (typeof Peer !== "undefined") {
        try {
            peer = new Peer("MBB-" + roomCode);
            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
            });
        } catch (e) {}
    }
}

function joinRoom() {
    const code = document.getElementById("joinCode").value.trim().toUpperCase();
    if (!code) return;
    roomCode = code;
    document.getElementById("status").innerText = "Ansluter till " + roomCode + "...";
    
    if (typeof Peer !== "undefined") {
        peer = new Peer();
        peer.on('open', function() {
            conn = peer.connect("MBB-" + roomCode);
            conn.on('open', function() {
                setupConnection();
                startGame();
            });
        });
    }
}

function setupConnection() {
    conn.on('data', function(data) {
        if (data.type === "move" && enemyMesh) {
            enemyMesh.position.set(data.x, data.y - 1.6, data.z);
            enemyMesh.rotation.y = data.ry;
        } else if (data.type === "shoot") {
            spawnBullet(new THREE.Vector3(data.x, data.y, data.z), new THREE.Vector3(data.dx, data.dy, data.dz), false);
        } else if (data.type === "build") {
            placeBuilding(new THREE.Vector3(data.x, data.y, data.z), data.ry, data.mode);
        } else if (data.type === "hit") {
            hp -= 20;
            document.getElementById("hpDisplay").innerText = hp;
            if (hp <= 0) {
                hp = 100;
                document.getElementById("hpDisplay").innerText = hp;
                camera.position.set(Math.random() * 20 - 10, 2, Math.random() * 20 - 10);
                const banner = document.getElementById("msgBanner");
                banner.style.display = "block";
                setTimeout(function() { banner.style.display = "none"; }, 2000);
            }
        }
    });
}

function startGame() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "block";
    document.getElementById("crosshair").style.display = "block";
    document.getElementById("controls").style.display = "block";
    document.getElementById("roomDisplay").innerText = roomCode;

    if (typeof THREE === "undefined") {
        alert("3D-motorn (Three.js) kunde inte laddas. Kontrollera länkarna på rad 22-23 i koden!");
        return;
    }

    init3D();
    animate();
}

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf97316);
    scene.fog = new THREE.FogExp2(0xfb923c, 0.012);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);
    camera.rotation.order = "YXZ";

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Gyllene kvällsbelysning
    const hemiLight = new THREE.HemisphereLight(0xffedd5, 0x431407, 0.9);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfde047, 1.2);
    sunLight.position.set(-50, 25, -80);
    scene.add(sunLight);

    // Glödande sol vid horisonten
    const sunGeo = new THREE.SphereGeometry(14, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunMesh.position.set(-60, 22, -140);
    scene.add(sunMesh);

    // Mark med varm kvällston
    const floorGeo = new THREE.PlaneGeometry(240, 240);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x3f6212 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(240, 60, 0x713f12, 0x4d7c0f);
    scene.add(grid);

    // Bergssilhuetter runt banan
    const mountainMat = new THREE.MeshLambertMaterial({ color: 0x292524 });
    for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2;
        const dist = 105 + Math.random() * 15;
        const height = 18 + Math.random() * 25;
        const mGeo = new THREE.ConeGeometry(22, height, 5);
        const mountain = new THREE.Mesh(mGeo, mountainMat);
        mountain.position.set(Math.cos(angle) * dist, height / 2 - 1, Math.sin(angle) * dist);
        scene.add(mountain);
    }

    // Spelarens händer och vapen
    const armGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xfcd34d });
    
    leftArm = new THREE.Mesh(armGeo, skinMat);
    leftArm.position.set(-0.35, -0.3, -0.4);
    camera.add(leftArm);

    rightArm = new THREE.Mesh(armGeo, skinMat);
    rightArm.position.set(0.35, -0.3, -0.4);
    camera.add(rightArm);

    const gunGeo = new THREE.BoxGeometry(0.1, 0.15, 0.5);
    const gunMat = new THREE.MeshLambertMaterial({ color: 0x1c1917 });
    gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.set(0, 0.08, -0.25);
    rightArm.add(gun);

    scene.add(camera);

    // Motståndare
    const enemyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
    const enemyMat = new THREE.MeshLambertMaterial({ color: 0xdc2626 });
    enemyMesh = new THREE.Mesh(enemyGeo, enemyMat);
    enemyMesh.position.set(0, -10, 0);
    scene.add(enemyMesh);

    document.body.addEventListener('click', function() {
        if (document.pointerLockElement !== document.body) {
            document.body.requestPointerLock();
        }
    });

    document.addEventListener('mousemove', function(e) {
        if (document.pointerLockElement === document.body) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }
    });

Använd koden med försiktighet.
document.addEventListener('mousedown', function(e) {
if (document.pointerLockElement !== document.body) return;
if (e.button === 0) shoot();
if (e.button === 2) build();
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
switch (e.code) {
case 'KeyW': moveForward = true; break;
case 'KeyS': moveBackward = true; break;
case 'KeyA': moveLeft = true; break;
case 'KeyD': moveRight = true; break;
case 'Space': if (canJump) { velocity.y += 12; canJump = false; } break;
case 'KeyE': build(); break;
case 'KeyQ':
buildMode = buildMode === "wall" ? "ramp" : "wall";
document.getElementById("buildModeDisplay").innerText = (buildMode === "wall" ? "Vägg" : "Ramp") + " [Q]";
break;
}
});
document.addEventListener('keyup', function(e) {
switch (e.code) {
case 'KeyW': moveForward = false; break;
case 'KeyS': moveBackward = false; break;
case 'KeyA': moveLeft = false; break;
case 'KeyD': moveRight = false; break;
}
});
}
function shoot() {
const dir = new THREE.Vector3();
camera.getWorldDirection(dir);
const startPos = camera.position.clone().add(dir.clone().multiplyScalar(0.8));
spawnBullet(startPos, dir, true);
rightArm.position.z = -0.25;
if (conn && conn.open) {
conn.send({ type: "shoot", x: startPos.x, y: startPos.y, z: startPos.z, dx: dir.x, dy: dir.y, dz: dir.z });
}
}
function spawnBullet(pos, dir, isMine) {
const bGeo = new THREE.SphereGeometry(0.12, 8, 8);
const bMat = new THREE.MeshBasicMaterial({ color: isMine ? 0xfef08a : 0xef4444 });
const bullet = new THREE.Mesh(bGeo, bMat);
bullet.position.copy(pos);
scene.add(bullet);
bullets.push({ mesh: bullet, dir: dir, isMine: isMine, life: 60 });
}
function build() {
const dir = new THREE.Vector3();
camera.getWorldDirection(dir);
dir.y = 0;
dir.normalize();
const targetPos = camera.position.clone().add(dir.multiplyScalar(3.5));
const snapX = Math.round(targetPos.x / 4) * 4;
const snapZ = Math.round(targetPos.z / 4) * 4;
const snapY = Math.max(2, Math.round(camera.position.y / 4) * 4 + 2);
const snapRot = Math.round(camera.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
const pos = new THREE.Vector3(snapX, snapY, snapZ);
placeBuilding(pos, snapRot, buildMode);
if (conn && conn.open) {
conn.send({ type: "build", x: pos.x, y: pos.y, z: pos.z, ry: snapRot, mode: buildMode });
}
}
function placeBuilding(pos, rotY, mode) {
const geo = new THREE.BoxGeometry(4, 4, 0.3);
const mat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
const mesh = new THREE.Mesh(geo, mat);
// Snygg mörk träram runt varje byggblock
const edges = new THREE.EdgesGeometry(geo);
const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x451a03 }));
mesh.add(line);
mesh.position.copy(pos);
mesh.rotation.y = rotY;
mesh.userData.mode = mode;
if (mode === "ramp") {
mesh.rotation.x = Math.PI / 4;
}
scene.add(mesh);
buildings.push(mesh);
}
function animate() {
requestAnimationFrame(animate);
const time = performance.now();
const delta = (time - prevTime) / 1000;
prevTime = time;
velocity.x -= velocity.x * 10.0 * delta;
velocity.z -= velocity.z * 10.0 * delta;
velocity.y -= 30.0 * delta;
const forward = new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y = 0;
forward.normalize();
const right = new THREE.Vector3();
right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
const isMoving = moveForward || moveBackward || moveLeft || moveRight;
if (moveForward) { velocity.x += forward.x * 80 * delta; velocity.z += forward.z * 80 * delta; }
if (moveBackward) { velocity.x -= forward.x * 80 * delta; velocity.z -= forward.z * 80 * delta; }
if (moveRight) { velocity.x += right.x * 80 * delta; velocity.z += right.z * 80 * delta; }
if (moveLeft) { velocity.x -= right.x * 80 * delta; velocity.z -= right.z * 80 * delta; }
const nextX = camera.position.x + velocity.x * delta;
const nextZ = camera.position.z + velocity.z * delta;
let blocked = false;
const playerBox = new THREE.Box3(
new THREE.Vector3(nextX - 0.4, camera.position.y - 1.5, nextZ - 0.4),
new THREE.Vector3(nextX + 0.4, camera.position.y + 0.3, nextZ + 0.4)
);
buildings.forEach(function(b) {
if (b.userData.mode === "wall") {
const wallBox = new THREE.Box3().setFromObject(b);
if (playerBox.intersectsBox(wallBox)) {
blocked = true;
}
}
});
if (!blocked) {
camera.position.x = nextX;
camera.position.z = nextZ;
}
camera.position.y += velocity.y * delta;
let groundHeight = 2;
buildings.forEach(function(b) {
if (Math.abs(camera.position.x - b.position.x) < 2.2 && Math.abs(camera.position.z - b.position.z) < 2.2) {
if (b.userData.mode === "ramp") {
groundHeight = Math.max(groundHeight, b.position.y + 1.5);
}
}
});
if (camera.position.y < groundHeight) {
velocity.y = 0;
camera.position.y = groundHeight;
canJump = true;
}
if (isMoving && canJump) {
walkTime += delta * 12;
leftArm.position.y = -0.3 + Math.sin(walkTime) * 0.05;
leftArm.position.z = -0.4 + Math.cos(walkTime) * 0.08;
rightArm.position.y = -0.3 - Math.sin(walkTime) * 0.05;
rightArm.position.z += (-0.4 - Math.cos(walkTime) * 0.05 - rightArm.position.z) * 0.2;
} else {
leftArm.position.y += (-0.3 - leftArm.position.y) * 0.1;
leftArm.position.z += (-0.4 - leftArm.position.z) * 0.1;
rightArm.position.y += (-0.3 - rightArm.position.y) * 0.1;
rightArm.position.z += (-0.4 - rightArm.position.z) * 0.1;
}
for (let i = bullets.length - 1; i >= 0; i--) {
const b = bullets[i];
b.mesh.position.add(b.dir.clone().multiplyScalar(1.5));
b.life--;
if (b.isMine && enemyMesh && b.mesh.position.distanceTo(enemyMesh.position) < 1.2) {
if (conn && conn.open) conn.send({ type: "hit" });
b.life = 0;
}
if (b.life <= 0) {
scene.remove(b.mesh);
bullets.splice(i, 1);
}
}
