<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>D4NZON Spelportal</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 30px; background: white; border-bottom: 1px solid #e2e8f0;
        }
        .logo { font-size: 22px; font-weight: bold; }
        .search {
            width: 350px; padding: 10px 16px; border-radius: 20px;
            border: 1px solid #cbd5e1; background: #f1f5f9; font-size: 14px;
        }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        .pill { padding: 8px 14px; border-radius: 20px; border: 1px solid #cbd5e1; background: white; font-size: 13px; cursor: pointer; }
        .user-badge { background: #0f172a; color: white; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .container { max-width: 1100px; margin: 25px auto; padding: 0 20px; }
        .categories { display: flex; gap: 10px; margin-bottom: 30px; }
        .cat-btn { padding: 8px 18px; border-radius: 20px; border: none; background: #e2e8f0; font-weight: bold; cursor: pointer; }
        .cat-btn.active { background: #0f172a; color: white; }
        h2 { font-size: 20px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card {
            background: white; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.15s; display: block;
        }
        .card:hover { transform: translateY(-4px); }
        .thumb { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .card-info { padding: 12px 15px; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .card-cat { font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center; gap: 20px;">
        <div class="logo">D4NZON Spel</div>
        <input type="text" class="search" id="searchInput" placeholder="Vad vill du spela idag?" onkeyup="filterGames()">
    </div>
    <div class="nav-right">
        <button class="pill">Event</button>
        <div class="user-badge">D4NZON</div>
    </div>
</header>

<div class="container">
    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('Alla', this)">Alla</button>
        <button class="cat-btn" onclick="filterCategory('Multiplayer', this)">Multiplayer</button>
        <button class="cat-btn" onclick="filterCategory('Action', this)">Action</button>
        <button class="cat-btn" onclick="filterCategory('Pussel', this)">Pussel</button>
    </div>

    <h2>Senast spelade</h2>
    <div class="grid" id="gameGrid">
        <a href="fortwars.html" class="card" data-cat="Multiplayer" data-name="fortwars mini build battle">
            <div class="thumb" style="background: #dbeafe;">🧱</div>
            <div class="card-info">
                <div class="card-title">Fortwars 3D</div>
                <div class="card-cat">Multiplayer</div>
            </div>
        </a>

        <a href="#" class="card" data-cat="Action" data-name="rullboll">
            <div class="thumb" style="background: #e0e7ff;">🔵</div>
            <div class="card-info">
                <div class="card-title">Rullboll</div>
                <div class="card-cat">Action</div>
            </div>
        </a>

        <a href="#" class="card" data-cat="Pussel" data-name="clicker">
            <div class="thumb" style="background: #fef3c7;">🎯</div>
            <div class="card-info">
                <div class="card-title">Clicker</div>
                <div class="card-cat">Pussel</div>
            </div>
        </a>

        <a href="#" class="card" data-cat="Multiplayer" data-name="rocket league">
            <div class="thumb" style="background: #dcfce7;">🚗</div>
            <div class="card-info">
                <div class="card-title">Rocket Car</div>
                <div class="card-cat">Multiplayer</div>
            </div>
        </a>
    </div>
</div>

<script>
function filterCategory(category, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.querySelectorAll('.card').forEach(card => {
        if (category === 'Alla' || card.dataset.cat === category) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

function filterGames() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
        const name = card.dataset.name;
        card.style.display = name.includes(query) ? 'block' : 'none';
    });
}
</script>

</body>
</html>
